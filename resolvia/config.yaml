# https://developers.home-assistant.io/docs/apps/configuration
name: ResolvIA
version: "2.5.0"
slug: resolvia
description: Suas listas de tarefas do Home Assistant num visual caprichado, com tarefas que voltam sozinhas e leitura de listas por foto.
url: "https://github.com/diegozapella63/resolvia-ha/tree/main/resolvia"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:clipboard-check-outline
panel_title: ResolvIA
panel_admin: false
homeassistant_api: true
# Photos are handed to Home Assistant's AI Task through the media folder
# (media/resolvia/ia-temp) while the AI reads them, then deleted.
# Backups (Mais > Dados) go to share/resolvia.
map:
  - media:rw
  - share:rw
